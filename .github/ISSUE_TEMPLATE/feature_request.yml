name: Feature request
description: Suggest an improvement or support for another printer or setup.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and test G-code
      description: For new printer support, list the model and whether you can test on it. A sample G-code file helps a lot.
