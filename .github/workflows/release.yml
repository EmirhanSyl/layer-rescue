name: Release

# Push a tag such as v0.2.3 to build the installer and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from layer_rescue._version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match src/layer_rescue/_version.py ($version)"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install build tools
        run: python -m pip install --upgrade pip build pyinstaller

      - name: Test
        run: |
          python -m pip install .
          python -m unittest discover -s tests

      - name: Build wheel and sdist
        run: python -m build --outdir release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version $env:VERSION

      - name: Checksums and release notes
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
          python .github/scripts/changelog_section.py $env:VERSION release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem release -File).FullName `
            --title "Layer Rescue $env:VERSION" --notes-file release-notes.md --verify-tag

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            release/*.whl
            release/*.tar.gz

  pypi:
    # Optional. Set the repository variable PUBLISH_TO_PYPI=true after configuring
    # a trusted publisher on PyPI (see docs/releasing.md).
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
